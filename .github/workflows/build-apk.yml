name: Build TGVideo Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      TGVIDEO_APP_URL: ${{ vars.TGVIDEO_APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: bun install --frozen-lockfile
      - run: node scripts/prepare-android.mjs
      - name: Build release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Configure Android signing secrets before release."; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          sdkmanager 'build-tools;35.0.0'
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out app-release.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app-release.apk
          rm "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: TGVideo-Android
          path: app-release.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app-release.apk
